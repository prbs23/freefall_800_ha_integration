blueprint:
  name: "FreeFall: Timer Expired"
  description: >
    Runs an action once when the cook timer expires. Requires the
    FreeFall integration.
  domain: automation
  source_url: https://gitlab.com/prbs23/freefall_800_ha_integration/-/raw/main/blueprints/automation/freefall800/timer_expired.yaml
  input:
    grill_device:
      name: FreeFall
      selector:
        device:
          filter:
            - integration: freefall800
    notify_action:
      name: Notification action
      description: >
        What to do when the timer expires. Defaults to an in-app persistent notification.
      default:
        - action: persistent_notification.create
          data:
            title: FreeFall
            message: The timer has expired.
      selector:
        action: {}

trigger:
  - trigger: device
    device_id: !input grill_device
    domain: freefall800
    type: timer_expired

action: !input notify_action
